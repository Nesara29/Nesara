<!doctype html>
<html lang="en">
<head th:replace="admin/base :: head">
    
</head>
<body>
<th:block  th:replace="admin/base :: header">
</th:block>

 
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
    <h4 class="h4 mt-4 ml-3">User Management</h4>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group mr-2">
            <a class="btn btn-md btn-success" style="font-size: 12px;" href="/admin/usersadd"><i class="mdi mdi-account-plus mr-2"></i> Add New User</a>
        </div>
    </div>
</div>
 
<table id="example" class="table table-striped table-hover table-bordered table-sm" cellspacing="0" width="100%" style="background: white;padding: 0 5px;">

    <thead>
        <tr>
            <th>Photo</th>
            <th>Full name</th>
            <th>Email</th> 
            <th>Type</th>
            <th>Date Created</th>
            <th>Actions</th>
        </tr>
    </thead>
    
    <tbody>
 
       
        <tr th:each="user:${users}" th:class="${user.status==1?'active':'inactive'}">
            <td> 
                <img th:src="${'/home/viewprofileimg/'+user.id}" alt="" class="img-fluid rounded-circle" style="width: 34px;height: 34px;"></td> 
            <td class="special" th:text="${user.firstname +' ' +user.lastname}"></td>
            <td class="special" th:text="${user.email}"></td> 
            <td class="special" th:text="${user.type}"></td> 
            <td class="special" th:text="${user.creationtime}"></td>  
            <td>
                <a th:href="${'/admin/usersedit/'+user.id}" class="btn btn-info btn-sm" data-toggle="tooltip" data-placement="top" title="
                    Edit This User"><i class="mdi mdi-pencil"></i></a>

             </td>
        </tr>
  
 

<th:block  th:replace="admin/base :: footer">
</th:block>
  
<script>
  
    $(document).ready(function() {
        $('#example').DataTable(); 
    });
    
</script>

</body>
</html>
