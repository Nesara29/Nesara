<!doctype html>
<html lang="en">
<head th:replace="admin/base :: head">
    
</head>
<body>
<th:block  th:replace="admin/base :: header">
</th:block>
   <div class="container">
    
        <div class="row">

            <div class="col-lg-8 offset-2 pl-3 pb-3 box-shadow mt-4 pt-3">
                <h5>Edit User</h5>
                
                <form method="post" action="/admin/users" class="ajaxfrm" th:data-return="${isclient==1?'/admin/client':'/admin/users'}"enctype="multipart/form-data">
                      <input type="hidden" name="action" value="edit">
                           <input type="hidden" name="id" th:value="${user.id}">
                    <div class="form-group">
                        <label for="booking_id">Type:</label>
                        <select class="custom-select form-control" id="type" name="type" required th:disabled="${isclient==1?'true':'false'}">  
                              <option th:each="b:${types}" th:value="${b.name}" th:text="${b.name}" th:selected="${b.name==user.type}"></option>
                        </select>
                    </div>
                   <div class="form-group">
                       <label for="">First name:</label>
                       <input type="text" name="firstname" class="form-control" th:value="${user.firstname}" placeholder="Enter First Name" required>
                   </div>
                    <div class="form-group">
                       <label for="">Last name:</label>
                       <input type="text" name="lastname" class="form-control" th:value="${user.lastname}" placeholder="Enter Last Name" required>
                   </div>
                    <div class="form-group">
                       <label for="">Email:</label>
                       <input type="email" name="email" class="form-control"  th:value="${user.email}" placeholder="Enter Email" disabled>
                   </div>
                    <div class="form-group">
                       <label for="">Mobile:</label>
                       <input type="text" name="mobile" class="form-control"  th:value="${user.mobile}" placeholder="Enter Mobile" required>
                   </div>
                    <div class="form-group">
                       <label for="">Password:</label>
                       <input type="password" name="password" class="form-control" placeholder="Enter new Password"  >
                   </div>
                   <div class="form-group">
                    <img th:src="${'/home/viewprofileimg/'+user.id}" class="w-25"/>
                   <label for="">Profile Image:</label>
                       <input type="file" name="img">
                   </div>
                   <div class="form-group">
                        <label for="price">Status</label>
                          <select class="form-control" name="status" required>
                            <option    value="0"  th:selected="${0==user.status}">Inactive</option>
                            <option    value="1"  th:selected="${1==user.status}">Actice</option>
                        </select>
                      </div>
                         <div class="msg msg-success text-success d-none"></div>
                            <div class="msg msg-error text-danger d-none"></div>
                   <button type="submit" name="submit" value="" class="btn btn-success btn-sm">Save User</button> 
                </form><!-- end of input form -->
 
            </div>
        </div>
    </div>



 

<th:block  th:replace="admin/base :: footer">
</th:block>
  

</body>
</html>
