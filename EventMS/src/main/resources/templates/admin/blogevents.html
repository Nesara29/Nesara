<!doctype html>
<html lang="en">
<head th:replace="admin/base :: head">
    
</head>
<body>
<th:block  th:replace="admin/base :: header">
</th:block>


<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
    <h4 class="h4 mt-4 ml-3">Event's Information Section</h4>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group mr-2">
            <a class="btn btn-md btn-success" style="font-size: 12px;" href="/admin/blogeventsadd"><i class="mdi mdi-account-plus mr-2"></i> Add New Info.</a>
        </div>
    </div>
</div>
        <span   th:if="${session.message}" th:utext="${#ctx.httpSession.message}"></span>

<table id="example" class="table table-striped table-hover table-bordered table-sm" cellspacing="0" width="100%" style="background: white;padding: 0 5px;">

    <thead>
        <tr>
            <th>Type</th>
            <th>Title</th>
            <th>Description</th>
            <th>Location</th>
            <th>Status</th>
            <th>Date</th>
            <th>Date Created</th>
            <th>Date Published</th>
            <th>Tools</th>
        </tr>
    </thead>
  
    <tbody>
       
        <tr  th:each="e:${posts}">
            <td class="special" th:utext="${e.category+'<br/>'+e.subcategory}"></td>
            <td class="special" th:utext="${#strings.length(e.title)>30?#strings.substring(e.title,0, 30):e.title}"></td>
          
            <td class="special" th:utext="${#strings.length(e.description)>30?#strings.substring(e.description,0, 20):e.description}"></td>
            
            <td class="special" th:text="${#strings.length(e.location)>30?#strings.substring(e.location,0, 20):e.location}"></td>
            
            <td class="special" th:text="${e.status == 0 ? 'Drafted' : 'Published'}"></td>
            
            <td class="special" th:text="${e.edate}"></td>
            
            <td class="special" th:text="${e.creationtime}"></td>
            <td class="special" th:text="${e.datepublished==null? 'Unpublished' : e.datepublished}"></td>
            
            <td>
                <a th:href="${'/admin/blogeventsedit/'+e.id}" class="btn btn-info btn-sm active"><i class="mdi mdi-account-edit"></i></a>
                
                <a th:href="${'/home/postdetails/'+e.id}" target="_blank" class="btn btn-warning btn-sm active"><i class="mdi mdi-eye"></i></a>
            </td>

        </tr>
 
    </tbody>
</table>

<th:block  th:replace="admin/base :: footer">
</th:block>
 <script>
  
    $(document).ready(function() {
        $('#example').DataTable();
        $('[data-toggle="tooltip"]').tooltip();
    });

    
    
</script>

</body>
</html>
