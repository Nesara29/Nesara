<!doctype html>
<html lang="en">
<head th:replace="admin/base :: head">
    
</head>
<body>
<th:block  th:replace="admin/base :: header">
</th:block>

 
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
    <h4 class="h4 mt-4">Gallery </h4>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group mr-2">
            <a class="btn btn-primary mr-2 text-uppercase" style="font-size: 12px;font-weight: bold;" href="/admin/photosadd"><i class="mdi mdi-upload mr-2"></i> Upload Image</a>
        </div>
    </div>
</div>
 
<div class="row">
    <div class="col-md-12">
        <div class="card-columns"> 
                <div class="card" style="position: relative;"  th:each="g:${galleries}">
                    <a th:href="${'/home/viewgalleryimg/'+g.id}" data-lightbox="gallery-group-4">
                        <img class="card-img-top" th:src="${'/home/viewgalleryimg/'+g.id}" alt="Card image cap">
                    </a>
                    <div class="card-body" style="position: absolute;bottom: 0;left:0; width: 100%;background: rgba(0,0,0, 0.5);color:white;padding: 10px 10px 0 10px;">
                        <p class="card-title text-capitalize" style="font-size:14px;">
                            <span  th:text="${g.title==''?'No Title':g.title}"></span>
                            <span class="float-right pb-2">
                              <a th:href="${'/admin/photosedit/'+g.id}" class="btn btn-info btn-sm" data-toggle="tooltip" title="Edit This Picture"><i class="mdi mdi-pencil"></i></a>
                              <a th:href="${'/admin/photosdelete/'+g.id}" class="btn btn-danger btn-sm" data-toggle="tooltip" title="Delete This Picture"><i class="mdi mdi-delete"></i></a>
                          </span>
                        </p>
                    </div>
                </div><!-- end of body --> 
        </div><!-- end of card columns -->
    </div>
</div><!-- end of col-md-12 -->
</div><!-- end of row -->

<th:block  th:replace="admin/base :: footer">
</th:block>
  
 <link rel="stylesheet" href="/assets/lightbox/css/lightbox.css">
 <script src="/assets/lightbox/js/lightbox-2.6.min.js"></script>
</body>
</html>
