<!doctype html>
<html lang="en">
<head th:replace="subadmin/base :: head">
    
</head>
<body>
<th:block  th:replace="subadmin/base :: header">
</th:block>

<div class="container">
    
     <div class="row">
        <div class="col-md-12 p-0" style="margin-bottom: 20px;"> <!-- border:1px solid rgba(0,0,0,.125) -->
           
            <div class="col-6 bg-white float-left h-100">
                <h5 class="h5 text-uppercase mb-5 pt-3 pl-3 pr-3">
                    <span class="float-left text-capitalize"><span th:text="${subcategory.name+' '+category.name}"></span> Package  </span>
                    <span class="float-right text-capitalize">Price: <span class="amount" th:text="${subcategory.price}"></span></span>
                </h5>
                <img th:src="${'/home/viewpackageimg/'+subcategory.id}" class="w-100" alt="">

                <ul class="list-group">
                        <li class="list-group-item list-group-item-action bg-danger flex-column align-items-start active">
                            <div class="d-flex w-100 justify-content-between">
                                <h5 class="mb-1 pt-2 pb-2">FUNCTIONS AND SERVICES</h5>
                            </div>
                        </li> 
                        
                            <li th:each="f:${features}" class="list-group-item list-group-item-action flex-column align-items-start">
                                <div class="d-flex w-100 justify-content-between">
                                    <h5 class="mb-1"><i class="mdi mdi-check mr-3"></i><span th:text="${f.name}"></span></h5>
                                </div>
                                <p class="mb-1 ml-3 text-capitalize"><span th:text="${f.description}"></span></p>
                            </li>
                      </div>
            
 <div class="col-6 bg-white float-right h-100 pt-5">
 <div class="form-group"> 
   <span class="form-control" th:text="${booking.title}"></span>
 </div>
  <div class="form-group"> 
   <span class="form-control" th:text="${booking.details}"></span>
 </div>
 <div class="form-group"> 
   <span class="form-control" th:text="${booking.fromdate+' to '+booking.todate}"></span>
 </div>
  <div class="form-group"> 
   <span class="form-control" th:text="${status}"></span>
 </div> 
 <div class="form-group"> 
   <span class="form-control" th:text="${'Booked at '+booking.creationtime}"></span>
 </div>
 
  <div class="form-group" th:if="${incharge}"> 
    <label>Incharge:</label><br/>
   <span class="form-control" th:text="${incharge.getName()}"></span>
   <span class="form-control" th:text="${incharge.mobile}"></span>
   <span class="form-control" th:text="${incharge.email}"></span>
 </div>
 
 <div class="form-group" th:if="${booking.status>0}"> 
    <h4>Payments:</h4><br/> 
    <label>Paid:</label><span class="amount" th:text="${paid}"></span> 
    <table class="table">
      <thead>
        <tr><th>Date</th><th>Mode</th><th>Amount</th></tr>
      </thead>
      <tbody>
       <tr th:each="p:${payments}">
       <td th:text="${p.creationtime}"></td>
       <td th:text="${p.paymentmode}"></td>
       <td class="amount" th:text="${p.amount}"></td>
       </tr>
       <tr th:if="${payments.size()==0}">
       <th colspan="3">No Records found</th>
       </tr>
      </tbody>
    </table>
 </div>
 </div>
 </div><!-- end of col-md-8 p-0 pl-3 -->
 
 
 
 
           <div class="col-12 bg-white">
            
       <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
    <h4 class="h4 mt-4 ml-3">Events</h4>
     <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group mr-2">
            <a class="btn btn-md btn-success mr-2" style="font-size: 12px;font-weight:900;"  onclick="addpopup()"><i class="mdi mdi-buffer mr-2"></i> Add New Event</a>
        </div>
    </div>
</div>

 
        <div class="col-md-12">
            <table id="listtab" class="table table-striped table-hover table-bordered table-sm" cellspacing="0" width="100%" style="background: white;padding: 5px">

                <thead>
                     <tr><th>Title</th><th>Venue</th><th>Location</th><th>Guests</th><th>Time</th><th>Status</th><th>Actions</th></tr>
                </thead>
              
                <tbody>
                    
</tbody>
</table>
</div>
</div><!-- end of container -->
  </div>
  </div>
<th:block  th:replace="subadmin/base :: footer">
</th:block>
  

   
<div class="modal fade" id="addpopupModal"   aria-hidden="true" aria-labelledby="exampleModalToggleLabel" tabindex="-1">

  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger">
        <h5 class="modal-title">Add Event</h5>
        <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close">X</button>
      </div>
       <form action="/subadmin/events" method="post" id="frmadd">
       <input type="hidden" name="action"  value="add">
        <input type="hidden" name="booking"  th:value="${booking.id}">
      <div class="modal-body">        
            
                             <div class="form-group">
                             <label for="name">Title</label> 
                                <input class="form-control" id="title" name="title" type="text" placeholder="Enter Title..."  required />
                               
                            </div>
                             <div class="form-group">
                             <label for="name">Venue(Address)</label> 
                                <input class="form-control" id="venue" name="venue" type="text" placeholder="Enter Venue"  required />
                               
                            </div>
                            <div class="form-group">
                        <label for="location">Location</label>
                        <select class="custom-select form-control" id="city" name="city" required>
                                  <option th:each="c:${cities}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                    </div>
                    <div class="form-group">
                             <label for="name">Guests</label> 
                                <input class="form-control" id="guests" name="guests" type="number" placeholder="Enter Number of guests"  required />
                               
                            </div>
                     <div class="form-group">
                             <label for="name">Start</label> 
                                <input class="form-control" id="start" name="start" type="datetime-local" placeholder="Enter Start "  required />
                               
                            </div>
                              <div class="form-group">
                             <label for="name">End</label> 
                                <input class="form-control" id="end" name="end" type="datetime-local" placeholder="Enter Start "  required />
                               
                            </div>
                             <div class="form-group" > 
    <label>Status:</label> 
      <select class="custom-select form-control" id="status" name="status" required>  
                              <option th:each="b:${statuses}" th:value="${b.acode}" th:text="${b.aname}" th:selected="${b.acode==booking.status}"></option>
                        </select>
 </div> 
        <div class="alert alert-danger" style="display:none"></div>
        <div class="alert alert-success"  style="display:none"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="submit" class="btn btn-primary">Add</button>
      </div>
       </form>
    </div>
  </div>
</div>

                    <div class="modal fade" id="editpopupModal"   aria-hidden="true" aria-labelledby="exampleModalToggleLabel" tabindex="-1">

  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger">
        <h5 class="modal-title">Edit Event</h5>
        <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close">X</button>
      </div>
       <form action="/subadmin/events" method="post" id="frmedit">
        <input type="hidden" name="booking" id="booking"  th:value="${booking.id}">
       <input type="hidden" name="action"  value="edit">
       <input type="hidden" name="id"  value="0">
      <div class="modal-body">        
            <!-- Name input-->
                             <div class="form-group">
                             <label for="name">Title</label> 
                                <input class="form-control" id="title" name="title" type="text" placeholder="Enter Title..."  required />
                               
                            </div>
                             <div class="form-group">
                             <label for="name">Venue(Address)</label> 
                                <input class="form-control" id="venue" name="venue" type="text" placeholder="Enter Venue"  required />
                               
                            </div>
                            <div class="form-group">
                        <label for="location">Location</label>
                        <select class="custom-select form-control" id="city" name="city" required>
                                  <option th:each="c:${cities}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                    </div>
                      <div class="form-group">
                             <label for="name">Guests</label> 
                                <input class="form-control" id="guests" name="guests" type="number" placeholder="Enter Number of guests"  required />
                               
                            </div>
                     <div class="form-group">
                             <label for="name">Start</label> 
                                <input class="form-control" id="start" name="start" type="datetime-local" placeholder="Enter Start "  required />
                               
                            </div>
                              <div class="form-group">
                             <label for="name">End</label> 
                                <input class="form-control" id="end" name="end" type="datetime-local" placeholder="Enter Start "  required />
                               
                            </div>
                             <div class="form-group" > 
    <label>Status:</label> 
      <select class="custom-select form-control" id="status" name="status" required>  
                              <option th:each="b:${statuses}" th:value="${b.acode}" th:text="${b.aname}" th:selected="${b.acode==booking.status}"></option>
                        </select>
 </div> 
                            
        <div class="alert alert-danger" style="display:none"></div>
        <div class="alert alert-success"  style="display:none"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="submit" class="btn btn-primary">Update</button>
      </div>
       </form>
    </div>
  </div>
</div>


        <div class="modal fade" id="deletepopupModal"   aria-hidden="true" aria-labelledby="exampleModalToggleLabel" tabindex="-1">

  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger">
        <h5 class="modal-title">Delete Event</h5>
        <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close">X</button>
      </div>
       <form action="/subadmin/events" method="post" id="frmdelete">
       <input type="hidden" name="booking" id="booking"  th:value="${booking.id}">
       <input type="hidden" name="action"  value="delete">
       <input type="hidden" name="id"  value="0">
      <div class="modal-body">        
            <!-- Name input-->
                            <div class="form-floating mb-3">
                                  Are you sure to delete '<span class="cname"></span>'? 
                            </div>
        <div class="alert alert-danger" style="display:none"></div>
        <div class="alert alert-success"  style="display:none"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
        <button type="submit" class="btn btn-primary">Yes</button>
      </div>
       </form>
    </div>
  </div>
</div>


  
   
  <script> 
   
    
  var dtable;
  
  function addpopup()
  {  

      $("#frmadd .alert").hide();
	  jQuery('#addpopupModal').modal('show');
  }
  $( function() {
	  $("#frmadd").off( "submit");
	   $("#frmadd").submit(function(e) {

	      e.preventDefault(); // avoid to execute the actual submit of the form.

	      var form = $(this);
	      var url = form.attr('action');
	      
	      $("#frmadd .alert").hide();
	      var data=form.serialize(); 
	      $.ajax({
	             type: "POST",
	             url: $(this).attr("action"),  
	             data:data , // serializes the form's elements.
	   		    dataType: "json",
	             success: function(data)
	             {
	   		      if(data.success)
	                  { $("#frmadd .alert.alert-success").html(data.message).show();  $("#frmadd")[0].reset(); loaddata();} // show response from the php script.
	   			  else
	   				  {
	   			     $("#frmadd .alert.alert-danger").html(data.message).show(); // show response from the php script.  
	   				  }
	   		  
	   		      }
	           });
	   		     }); 
	   $("#frmedit").off( "submit");
	   $("#frmedit").submit(function(e) {

	      e.preventDefault(); // avoid to execute the actual submit of the form.

	      var form = $(this);
	      var url = form.attr('action');
	      
	      $("#frmedit .alert").hide();
	      var data=form.serialize(); 
	      $.ajax({
	             type: "POST",
	             url: $(this).attr("action"),  
	             data:data , // serializes the form's elements.
	   		    dataType: "json",
	             success: function(data)
	             {
	   		      if(data.success)
	                  { $("#frmedit .alert.alert-success").html(data.message).show();  loaddata();} // show response from the php script.
	   			  else
	   				  {
	   			     $("#frmedit .alert.alert-danger").html(data.message).show(); // show response from the php script.  
	   				  }
	   		   
	   		      }
	           });
	   		     }); 
	   
	   $("#frmdelete").off( "submit");
	   $("#frmdelete").submit(function(e) {

	      e.preventDefault(); // avoid to execute the actual submit of the form.

	      var form = $(this);
	      var url = form.attr('action');
	      
	      $("#frmdelete .alert").hide();
	      var data=form.serialize(); 
	      $.ajax({
	             type: "POST",
	             url: $(this).attr("action"),  
	             data:data , // serializes the form's elements.
	   		    dataType: "json",
	             success: function(data)
	             {
	   		      if(data.success)
	                  { $("#frmdelete .alert.alert-success").html(data.message).show(); } // show response from the php script.
	   			  else
	   				  {
	   			     $("#frmdelete .alert.alert-danger").html(data.message).show(); // show response from the php script.  
	   				  }
	   		   loaddata();
	   		      }
	           });
	   		     }); 
	   loaddata();
  });
  
  function loaddata()
  { 
  	 if(dtable!=null) $('#listtab').DataTable().clear().destroy();
      $.ajax({
             type: "POST",
             url: "/subadmin/events",  
             data:{action:"readall",booking:$('#booking').val()} , // serializes the form's elements.
   		    dataType: "json",
             success: function(data)
             {
   		        if(data.success)
   		        	{
   		        	$("#listtab tbody").html("<h2>Loading.........</h2>");
   		        	var strhtml=""
   		        	data=data.data;
   		        	  for(var i=0;i<data.length;i++)
   		        		  {
   		        		     strhtml+="<tr>";
   		        		     strhtml+="<td>"+data[i].title+"</td>"; 
   		        		     strhtml+="<td>"+data[i].venue+"</td>"; 
   		        		     strhtml+="<td>"+data[i].location+"</td>"; 
   		        		     strhtml+="<td>"+data[i].guests+"</td>"; 
   		        		     strhtml+="<td>"+data[i].time+"</td>"; 
   		        		     strhtml+="<td>"+data[i].status+"</td>";  
   		        		      strhtml+="<td><a href='#' onclick='editpopup(this)'  data-id='"+data[i].id+"' class='btn btn-info btn-sm active'><i class='mdi mdi-account-edit'></i></a>";
   		        		     strhtml+=" <a href='#' onclick='deletepopup(this)'  data-id='"+data[i].id+"' class='btn btn-danger btn-sm active'><i class='mdi mdi-delete'></i></a></td>";
   		        		     strhtml+="</tr>";
   		        		  }
   		        	$("#listtab tbody").html(strhtml); 
   		        	dtable=$('#listtab').DataTable();  
   		        	}
   		      }
           });
  }
  function editpopup(ele)
  { 
      var id=$(ele).attr("data-id");
      
      $.ajax({
             type: "POST",
             url: "/subadmin/events",  
             data:{action:"read",id:id} , // serializes the form's elements.
   		    dataType: "json",
             success: function(data)
             {
   		        if(data.success)
   		        	{
   		        	data=data.data;
   		        	 $("#frmedit [name=title]").val(data.title);
   		        	 $("#frmedit [name=venue]").val(data.venue);
   		        	 $("#frmedit [name=city]").val(data.location);
   		        	 $("#frmedit [name=guests]").val(data.guests);
   		        	 $("#frmedit [name=start]").val(data.start.substring(0,19));
   		        	 $("#frmedit [name=end]").val(data.end.substring(0,19));
   		        	 $("#frmedit [name=status]").val(data.status);
   		        	 $("#frmedit [name=id]").val(data.id); 
   		             $("#frmedit .alert").hide();
   		 	         jQuery('#editpopupModal').modal('show');
   		        	}
   		        else
   		        	alert(data.message);
   		      }
           });
  }
  function deletepopup(ele)
  { 
      var id=$(ele).attr("data-id");
      
      $.ajax({
             type: "POST",
             url: "/subadmin/events",  
             data:{action:"read",id:id} , // serializes the form's elements.
   		    dataType: "json",
             success: function(data)
             {
   		        if(data.success)
   		        	{
   		        	data=data.data;
   		        	 $("#frmdelete .cname").html(data.title);
   		        	 $("#frmdelete [name=id]").val(data.id); 
   		             $("#frmdelete .alert").hide();
   		 	         jQuery('#deletepopupModal').modal('show');
   		        	}
   		        else
   		        	alert(data.message);
   		      }
           });
  }
    
</script>
</body>
</html>
