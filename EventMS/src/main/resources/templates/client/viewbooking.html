<!doctype html>
<html lang="en">
<head th:replace="client/base :: head">
    
</head>
<body>
<th:block  th:replace="client/base :: header">
</th:block>

<div class="container">
    
     <div class="row">
        <div class="col-md-12 p-0" style="margin-bottom: 20px;"> <!-- border:1px solid rgba(0,0,0,.125) -->
           
            <div class="col-6 bg-white float-left">
                <h5 class="h5 text-uppercase mb-5 pt-3 pl-3 pr-3">
                    <span class="float-left text-capitalize"><span th:text="${subcategory.name+' '+category.name}"></span> Package  </span>
                    <span class="float-right text-capitalize">Price: <span class="amount" th:text="${subcategory.price}"></span></span>
                </h5>
                <img th:src="${'/home/viewpackageimg/'+subcategory.id}" class="w-100" alt="">

                <ul class="list-group">
                        <li class="list-group-item list-group-item-action bg-danger flex-column align-items-start active">
                            <div class="d-flex w-100 justify-content-between">
                                <h5 class="mb-1 pt-2 pb-2">FUNCTIONS AND SERVICES</h5>
                            </div>
                        </li> 
                        
                            <li th:each="f:${features}" class="list-group-item list-group-item-action flex-column align-items-start">
                                <div class="d-flex w-100 justify-content-between">
                                    <h5 class="mb-1"><i class="mdi mdi-check mr-3"></i><span th:text="${f.name}"></span></h5>
                                </div>
                                <p class="mb-1 ml-3 text-capitalize"><span th:text="${f.description}"></span></p>
                            </li>
                      </div>
            
 <div class="col-6 bg-white float-right h-100 pt-5">
 <div class="form-group"> 
   <span class="form-control" th:text="${booking.title}"></span>
 </div>
  <div class="form-group"> 
   <span class="form-control" th:text="${booking.details}"></span>
 </div>
 <div class="form-group"> 
   <span class="form-control" th:text="${booking.fromdate+' to '+booking.todate}"></span>
 </div>
  <div class="form-group"> 
   <span class="form-control" th:text="${status}"></span>
 </div> 
 <div class="form-group"> 
   <span class="form-control" th:text="${'Booked at '+booking.creationtime}"></span>
 </div>
 
  <div class="form-group" th:if="${incharge}"> 
    <label>Incharge:</label><br/>
   <span class="form-control" th:text="${incharge.getName()}"></span>
   <span class="form-control" th:text="${incharge.mobile}"></span>
   <span class="form-control" th:text="${incharge.email}"></span>
 </div>
 <div class="form-group h4" th:if="${events.size()>0}"> 
    <a href="#" onclick="eventspopup()">Click here to see list of events for this booking</a>
 </div>
 
 <div class="form-group" th:if="${booking.status>0}"> 
    <h4>Payments:</h4><br/> 
    <label>Paid:</label><span class="amount" th:text="${paid}"></span>
    <button class="btn btn-primary float-right"  onclick="addpaymentpopup()">Pay</button>
    <table class="table">
      <thead>
        <tr><th>Date</th><th>Mode</th><th>Amount</th></tr>
      </thead>
      <tbody>
       <tr th:each="p:${payments}">
       <td th:text="${p.creationtime}"></td>
       <td th:text="${p.paymentmode}"></td>
       <td class="amount" th:text="${p.amount}"></td>
       </tr>
       <tr th:if="${payments.size()==0}">
       <th colspan="3">No Records found</th>
       </tr>
      </tbody>
    </table>
 </div>
 </div>
 </div><!-- end of col-md-8 p-0 pl-3 -->
            </div>
       

</div><!-- end of container -->
 
<th:block  th:replace="client/base :: footer">
</th:block>
   
 <div class="modal fade" id="eventsModal"   aria-hidden="true" aria-labelledby="exampleModalToggleLabel" tabindex="-1">

  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger">
        <h5 class="modal-title">Events</h5>
        <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close">X</button>
      </div> 
      <div class="modal-body">        
       <table class="table">
      <thead>
        <tr><th>Title</th><th>Venue</th><th>Location</th><th>Guests</th><th>Time</th><th>Status</th></tr>
      </thead>
      <tbody>
       <tr th:each="p:${events}">
       <td th:text="${p.title}"></td>
       <td th:text="${p.venue}"></td> 
       <td th:text="${p.location}"></td> 
       <td th:text="${p.guests}"></td> 
       <td th:text="${p.time}"></td> 
       <td th:text="${p.status}"></td> 
       </tr>
       <tr th:if="${events.size()==0}">
       <th colspan="5">No Records found</th>
       </tr>
      </tbody>
    </table>
      </div> 
      </div>
      </div>
      </div>
 
   

<div class="modal fade" id="addpopupModal"   aria-hidden="true" aria-labelledby="exampleModalToggleLabel" tabindex="-1">

  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger">
        <h5 class="modal-title">Payment</h5>
        <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close">X</button>
      </div>
       <form action="/client/addpayment"  th:data-return="${'/client/viewbooking/'+booking.id}" method="post" id="frmadd">
       <input type="hidden" name="booking"  th:value="${booking.id}">
      <div class="modal-body">        
            <!-- Name input-->
                            <div class="form-floating fw-bold mb-3">
                             <label for="amount">Amount</label> 
                                <input class="form-control" th:min="${1000}" id="amount" name="amount" type="number" placeholder="Enter Amount..."  required />
                               
                            </div>
                             <h4 class="mb-3">Payment</h4> 
        <div class="d-block my-3">
          <div >
            <input id="cardpayment" name="paymentMethod" type="radio" onchange='togglepayment()'  value='CARD'>
            <label   for="credit">Card Payment</label>
            <div id="carddetails" class="pl-4" style='display:none'>
            <div class="row">
  <div class=" col-3 mb-3 fw-bold">
                            Card Number:
                          </div>
                          <div class=" col-8 mb-3">
                                <input type="text" class="form-control" name="cardno" placeholder="0000 0000 0000 0000">
                          </div>
                            <div class=" col-3 mb-3 fw-bold">
                            Expiry Date:
                          </div>
                          <div class=" col-3 mb-3">
                                <input type="text" class="form-control" name="exp" placeholder="MM/YY">
                          </div>
                           <div class="form-floating col-3 mb-3 fw-bold">
                            CVC/CVV:
                          </div>
                          <div class=" col-3 mb-3">
                              
                                 <input type="text" class="form-control" name="cvv" placeholder="000">
                          </div>
            </div>
            </div>
          </div> 
                 <div >
            <input id="cashondelivery" name="paymentMethod" type="radio" onchange='togglepayment()'   value='UPI'>
            <label  for="paypal">Pay using QR code or UPI ID</label> 
               <div id="upidetails" style='display:none'>
            <div class="center paydiv"> 
              <p><b>UPI ID: <span th:text="${'8671327463'}"></span></b></p>
               
            </div>
           <div class="form-group">
            <img src="/assets/images/qrcode.png" style="width:150px;height: 150px;">
               <div>
              <label for="transactionid">Transaction ID</label> 
               <input id="transactionid" name="transactionid" type="text" class="validate">
               </div>
               </div>
            </div>
			
          </div>
        </div>  
                              
     
                   <div class="alert alert-danger" style="display:none"></div>
        <div class="alert alert-success"  style="display:none"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="submit" class="btn btn-primary">Add</button>
      </div>
       </form>
    </div>
  </div>
</div>


   

  
   
  <script> 
  function eventspopup()
  {  
 
	   jQuery('#eventsModal').modal('show');
  }
    function addpaymentpopup()
    {  

        $("#frmadd .alert").hide();
  	   jQuery('#addpopupModal').modal('show');
    }
    
    
    function togglepayment()
    {
 	   $("#carddetails,#upidetails").hide()
 	   if($("[name=paymentMethod]:checked").val()=="CARD")
 		   $("#carddetails").show();
 		else   
 			$("#upidetails").show()
    }
    
    $( function() {
    	  $("#frmadd").off( "submit");
    	   $("#frmadd").submit(function(e) {

    	      e.preventDefault(); // avoid to execute the actual submit of the form.

    	      var form = $(this);
    	      var url = form.attr('action');
    	      
    	      $("#frmadd .alert").hide();
    	      var data=form.serialize(); 
    	      $.ajax({
    	             type: "POST",
    	             url: $(this).attr("action"),  
    	             data:data , // serializes the form's elements.
    	   		    dataType: "json",
    	             success: function(data)
    	             {
    	   		      if(data.success)
    	                  { $("#frmadd .alert.alert-success").html(data.message).show();  $("#frmadd")[0].reset(); document.location.reload();} // show response from the php script.
    	   			  else
    	   				  {
    	   			     $("#frmadd .alert.alert-danger").html(data.message).show(); // show response from the php script.  
    	   				  }
    	   		  
    	   		      }
    	           });
    	   		     }); 
    }); 
</script>
</body>
</html>
