<!doctype html>
<html lang="en">
  <head th:fragment="head">
<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Client Panel</title>
 <link rel="icon" type="image/x-icon" href="/assets/images/logo/WPMSlogo.png">
    <!-- Bootstrap core CSS -->
    <link href="/assets/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom styles for this template -->
    <link href="/assets/css/dashboard.css" rel="stylesheet">
    <link href="/assets/css/dataTables.bootstrap4.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/font-awesome.min.css"> 
    <link rel="stylesheet" type="text/css"

    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700" rel="stylesheet">


  </head>
  <body>
  <th:block th:fragment="header">
    <nav class="navbar sticky-top p-0" style="width: 16.7%;background-color: #f44336;">
    <a class="navbar-brand col-sm-3 col-md-2 mr-0" style="color:white;" href="/client/dashboard"> 
        Client Panel
    </a>
</nav>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block bg-light sidebar">
            <div class="sidebar-sticky">
                <ul class="nav flex-column">
                    <li class="nav-item mt-3">
                        <div class="text-center">
                            <a href="/client/dashboard" class="user-button">
                                <img src="/home/myprofileimg" class="img-fluid rounded-circle" width="52" height="52" alt="">
                                <div class="user-profile" th:utext="${@userService.getUserName()}"></div>
                            </a>
                                <div class="text-center mt-0" style="font-size: 11px;color:#72777a;" th:utext="${@userService.getUserType()}">
                                     
                                </div>
                        </div>
                    </li>
                    <li class="nav-item"><div class="dropdown-divider"></div></li>

                    <li class="nav-item">
                        <a class="nav-link" href="/client/dashboard">
                            <i class="mdi mdi-home mr-3" style="color:#242424;"></i>
                            Dashboard <span class="sr-only">(current)</span>
                        </a>
                    </li>
                     
                     
    <li class="nav-item"><div class="dropdown-divider"></div></li>
                    <li class="nav-item">
                        <a class="nav-link" href="/client/bookingadd" >
                            <i class="mdi mdi-account-multiple mr-3" style="color: #2196f3"></i>
                            Add Booking
                        </a>
                    </li>
    <li class="nav-item"><div class="dropdown-divider"></div></li>
                    <li class="nav-item">
                        <a class="nav-link" href="/client/bookings" >
                            <i class="mdi mdi-account-multiple mr-3" style="color: #2196f3"></i>
                            Bookings
                        </a>
                    </li>
                    
  
                    
                    <li class="nav-item"><div class="dropdown-divider"></div></li>
                    <li class="nav-item">
                        <a class="nav-link" href="/client/changepassword">
                            <i class="mdi mdi-calendar-text mr-3" style="color: #f44336!important;"></i>
                            Change Password
                        </a>
                    </li>
                     <li class="nav-item"><div class="dropdown-divider"></div></li>
                    <li class="nav-item">
                        <a class="nav-link" href="/client/editprofile">
                            <i class="mdi mdi-calendar-text mr-3" style="color: #f44336!important;"></i>
                            Edit Profile
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        <main role="main" class="col-md-9 ml-sm-auto col-lg-10" style="margin-top: -40px;z-index: 999">
            <nav class="navbar navbar-expand-lg navbar-light bg-light" style="margin-left:-15px;margin-right: -15px;">
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">

                    </ul>
                </div>

                <div class="form-inline my-2 my-lg-0">
                    <a class="nav-link" href="/"><b th:utext="${@userService.getUserName()}"></b></a>
                    <a class="nav-link" href="/logout"><b><i class="mdi mdi-logout" style="color: #f44336!important;"></i> Logout</b></a>
                </div>
            </nav>
    
 
  </th:block>

          
  
  
     <th:block  th:fragment="footer"> 
  
</main>
</div>
</div>

 <script src="/assets/js/popper.min.js"></script>

<script src="/assets/js/jquery.dataTables.min.js"></script>
<script src="/assets/js/dataTables.bootstrap4.min.js"></script> 
<script src="/assets/js/script.js"></script>
