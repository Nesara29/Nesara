<!doctype html>
<html lang="en">
<head th:replace="base :: head">
    
</head>
<body>
<th:block  th:replace="base :: header">
</th:block>

     <div class="container">
    <div class="row">
        <div class="col-lg-12">
            <h4 class="h2 text-center mb-0">THE LATEST INSPIRATION</h4>
            <p class="text-muted text-center">Discover the best ideas, tips and articles to inspire your wedding or birthday celebrations.</p>
        </div>
           <div class="card-columns"> 
               <div class="card"  th:each="b:${posts}">
                <img class="card-img-top"  th:src="${'/home/viewpostimg/'+b.id}"  alt="Card image cap">
                <div class="card-body">
                    <a th:href="${'/home/postdetails/'+b.id}" class="btn-stamp">
                        <h6 class="card-title mt-0 mb-0 text-center font-weight-bold font-custom text-uppercase" th:text="${b.title}"></h6>
                        <p class="card-text mt-0 mb-0 text-center color_gray" th:text="${b.subcategory+' '+b.category}"></p>
                        <p class="card-text mt-0 mb-0 text-center color_light text-capitalize"><i class="mdi mdi-map-marker"></i>
                            <span th:text="${b.location}"></span></p>
                    </a>
                </div>
            </div> 
          </div>

       
    </div>
</div>
     
<th:block  th:replace="base :: footer">
</th:block>
</body>
</html>
